name: Publish wiki

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - docs/**
      - .github/public-docs.txt
      - .github/scripts/publish_wiki.py
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish public documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Use WIKI_PUSH_TOKEN when configured; otherwise try the repository token.
      WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create Git authentication helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$WIKI_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"

      - name: Clone wiki repository
        shell: bash
        env:
          GIT_ASKPASS: ${{ runner.temp }}/git-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Render public documentation
        run: |
          python .github/scripts/publish_wiki.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --wiki-root "$RUNNER_TEMP/wiki"

      - name: Commit and push wiki changes
        shell: bash
        env:
          GIT_ASKPASS: ${{ runner.temp }}/git-askpass.sh
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git -C "$RUNNER_TEMP/wiki" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/wiki" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/wiki" add --all
          if git -C "$RUNNER_TEMP/wiki" diff --cached --quiet; then
            echo "Wiki is already synchronized."
            exit 0
          fi
          git -C "$RUNNER_TEMP/wiki" commit -m "docs: sync public repository documentation"
          git -C "$RUNNER_TEMP/wiki" push origin master
